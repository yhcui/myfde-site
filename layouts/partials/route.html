<figure class="route" aria-label="部署路线图：实验室、模型 API、系统集成、部署上线、客户现场。最后一公里是从部署上线到客户现场的 K1 段。">
  <svg viewBox="0 0 640 190" xmlns="http://www.w3.org/2000/svg" role="img">
    <defs>
      <linearGradient id="qinglv" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#3E8E7E" />
        <stop offset="1" stop-color="#2A5A7E" />
      </linearGradient>
    </defs>
    <path class="mtn-far" d="M0 112 L44 70 L88 112 L132 84 L184 112 L228 62 L276 112 L318 82 L368 112 L408 66 L456 112 L496 88 L540 112 L580 74 L640 112 Z" />
    <path class="mtn-near" d="M0 112 L60 92 L112 112 L170 98 L226 112 L290 94 L350 112 L430 96 L492 112 L548 100 L640 112 Z" />
    <line class="route-base" x1="48" y1="112" x2="592" y2="112" />
    <g class="route-stop" data-stop="lab" tabindex="0" role="button" aria-label="实验室，点击查看注解">
      <circle class="route-node" cx="48" cy="112" r="5.5" />
      <text class="route-label" x="48" y="148">实验室</text>
      <rect class="route-hit" x="12" y="94" width="72" height="62" />
    </g>
    <g class="route-stop" data-stop="api" tabindex="0" role="button" aria-label="模型 API，点击查看注解">
      <circle class="route-node" cx="195" cy="112" r="5.5" />
      <text class="route-label" x="195" y="148">模型 API</text>
      <rect class="route-hit" x="159" y="94" width="72" height="62" />
    </g>
    <g class="route-stop" data-stop="sys" tabindex="0" role="button" aria-label="系统集成，点击查看注解">
      <circle class="route-node" cx="342" cy="112" r="5.5" />
      <text class="route-label" x="342" y="148">系统集成</text>
      <rect class="route-hit" x="306" y="94" width="72" height="62" />
    </g>
    <g class="route-stop" data-stop="ship" tabindex="0" role="button" aria-label="部署上线，点击查看注解">
      <circle class="route-node" cx="489" cy="112" r="5.5" />
      <text class="route-label" x="489" y="148">部署上线</text>
      <rect class="route-hit" x="453" y="94" width="72" height="62" />
    </g>
    <g class="route-stop route-site-group" data-stop="site" tabindex="0" role="button" aria-label="客户现场，点击查看注解">
      <circle class="route-node route-node-site" cx="592" cy="112" r="6.5">
        <animate attributeName="stroke" from="#2A5A7E" to="#C3272B" begin="4.1s" dur="0.5s" fill="freeze" />
        <animate attributeName="fill" from="#FFFFFF" to="#C3272B" begin="4.1s" dur="0.5s" fill="freeze" />
      </circle>
      <text class="route-label route-label-site" x="592" y="148">客户现场<animate attributeName="fill" from="#2A5A7E" to="#C3272B" begin="4.1s" dur="0.5s" fill="freeze" /></text>
      <rect class="route-hit" x="556" y="94" width="80" height="62" />
    </g>
    <text class="route-k1-label" x="540" y="58">K1 · 最后一公里</text>
    <circle class="route-traveler" cx="48" cy="112" r="4" opacity="0">
      <set attributeName="opacity" to="1" begin="1.7s" />
      <animate attributeName="cx" values="48;48;195;342;489;592;592" keyTimes="0;0.12;0.32;0.52;0.72;0.92;1" dur="2.6s" begin="1.7s" calcMode="spline" keySplines="0.4 0.1 0.3 1;0.4 0.1 0.3 1;0.4 0.1 0.3 1;0.4 0.1 0.3 1;0.4 0.1 0.3 1;0.4 0.1 0.3 1" fill="freeze" />
    </circle>
    <circle class="route-pulse" cx="592" cy="112" r="7" opacity="0">
      <animate attributeName="r" from="7" to="20" begin="4.4s" dur="1.1s" fill="freeze" />
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.15;1" begin="4.4s" dur="1.1s" />
    </circle>
  </svg>
  <figcaption id="k1-note" class="k1-note" hidden></figcaption>
  <script>
    (function () {
      var notes = {
        lab: "实验室：模型在这里诞生——离真实价值，还有一整个产业化的距离。",
        api: "模型 API：第一个可被工程调用的形态。从这里开始，工程师有活干了。",
        sys: "系统集成：模型接入业务系统。很多团队停在这里，以为已经完成。",
        ship: "部署上线：系统在生产环境运行。离价值还差最后一段——别急着庆功。",
        site: "K1 · 客户现场：真正的价值在这里发生。剩下的路，在<a href=\"/y/\">档案</a>里。"
      };
      var note = document.getElementById("k1-note");
      document.querySelectorAll(".route-stop").forEach(function (g) {
        function show() {
          note.innerHTML = notes[g.dataset.stop];
          note.hidden = false;
        }
        g.addEventListener("click", show);
        g.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); show(); }
        });
      });
    })();
  </script>
</figure>
